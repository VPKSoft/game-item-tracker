name: Deploy to GitHub Pages

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

# Allow the job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Run one deployment at a time; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 26.x
      uses: actions/setup-node@v7
      with:
        node-version: 26.x
        cache: 'npm'
    - run: npm ci
    - run: npm test
    - name: Build
      run: npm run build
      env:
        # The site is served from https://vpksoft.github.io/game-item-tracker/
        BASE_PATH: /game-item-tracker/
    - uses: actions/configure-pages@v6
    - uses: actions/upload-pages-artifact@v5
      with:
        path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v5
